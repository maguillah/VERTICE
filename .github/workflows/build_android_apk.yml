name: Build VÉRTICE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VERTICE/**'
      - '.github/workflows/build_android_apk.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3 and Android templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Android debug signing
        run: |
          mkdir -p "$RUNNER_TEMP"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: |
          ./Godot_v4.3-stable_linux.x86_64 \
            --headless --editor --path VERTICE --quit

      - name: Run physics and campaign tests
        run: |
          ./Godot_v4.3-stable_linux.x86_64 \
            --headless --path VERTICE \
            --script res://tests/test_physics_and_campaign.gd

      - name: Export Android ARM64 APK
        run: |
          mkdir -p VERTICE/android/build
          ./Godot_v4.3-stable_linux.x86_64 \
            --headless --path VERTICE \
            --export-debug "Android" \
            android/build/VERTICE_Capitulo1_a_6.apk

          test -s VERTICE/android/build/VERTICE_Capitulo1_a_6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VERTICE-Android-ARM64-APK
          path: VERTICE/android/build/VERTICE_Capitulo1_a_6.apk
          if-no-files-found: error
