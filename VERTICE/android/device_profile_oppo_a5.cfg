[device_profile]
target_device="OPPO A5 (Snapdragon 6s 4G Gen 1)"
gpu="Adreno 619"
ram_gb=6
target_fps=30
renderer="gl_compatibility"
max_fog_layers=2
particle_budget_per_screen=48
shadow_atlas_disabled=true
viewport_base_resolution="1280x720"
texture_compression="ETC2/ASTC"

[quality_presets]
low_fps=30
low_fog_enabled=false
low_particles_scale=0.5

medium_fps=30
medium_fog_enabled=true
medium_particles_scale=0.75

high_fps=60
high_fog_enabled=true
high_particles_scale=1.0
